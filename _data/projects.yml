# Portfolio deck source of truth.
# Add an entry here and a new card appears in the deck at /games/.
#
#   sprite:  key from the sprite table in js/deck.js
#            (planet, mech, dog, fish, flask, spine, ball, note, squirrel)
#   kind:    award | jam | experiment | academic  -> drives the card's palette
#   links:   first link is the card's primary action
#   playable_here: true for builds served straight off this site,
#            which get a "plays in your browser" marker
#   event_url: the jam's page, which makes the award badge clickable
#   team:    true for projects built with other people, which earns a
#            "Team Project" chip. Absence is not a claim either way.
#   review:  jam feedback. `pull` is the one line shown on the card panel,
#            `quote` the longer excerpt in the Judges' Notes section, and
#            `source` defaults to the project's own `event` if omitted.

- id: galactic-marbles
  title: Galactic Marbles
  subtitle: Cosmic merge experiment
  kind: award
  sprite: planet
  year: 2025
  engine: Unity
  badge: Excellence Award
  event: Playful.AI Game Jam
  event_url: https://itch.io/jam/playfulai-jam-1
  team: true
  blurb: >-
    Combine asteroids into planets and planets into solar systems. Adaptive
    music layers stack as the universe expands, so the soundtrack gets bigger
    the further you merge.
  tags: [Unity, WebGL, Adaptive Audio]
  links:
