- id: space-dogs
  title: Space Dogs
  subtitle: Crash-land and befriend
  kind: jam
  sprite: dog
  year: 2024
  engine: Unity
  event: Pirate Software Game Jam 16
  event_url: https://itch.io/jam/pirate16
  team: true
  blurb: >-
    You are an alien who crash-lands on a strange world and adopts three dogs.
    Dig deeper with them to find out what the planet is hiding.
  tags: [Game Jam, Exploration]
  review:
    pull: >-
      I found myself walking away and leaving the game up just because it was
      so pretty to look at.
    quote: >-
      I enjoyed the exploration and the general vibe you get with the subtle
      glow, and it's exciting to find a new biome or a forest inside a dome.
      [...] I must emphasize how simply enjoyable it was to float around the
      map, which 100 percent added to my game time played. [...] I also loved
      the intro, including the music and sound choices; it very much kept me
      engaged. I also found myself walking away and leaving the game up just
      because it was so pretty to look at.
    source: Judge feedback
  links:
    - label: Play on itch.io
      url: https://tlsaxt.itch.io/spacedogs

